name: Release

on:

  push:
    branches:
      - main
    # NOTE: We only trigger on specific file paths to avoid unncessarily running the workflow
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '**/*.sh'
      # NOTE: Formula/ is written by GoReleaser during a release. It is left out
      # so that commit does not start another run.
      # NOTE: We need to trigger a release when a PR from release-please has been merged
      - ".release-please-manifest.json"
  workflow_dispatch:

jobs:

  release-please:

    permissions:
      contents: write
      pull-requests: write

    runs-on: ubuntu-latest

    outputs:
      releases_created: ${{ steps.r.outputs.releases_created }}
      tag_name: ${{ steps.r.outputs.tag_name }}

    steps:

      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: r
        with:
          token: ${{ secrets.OKCTL_FINE_GRAINED_TOKEN }}


  goreleaser:

    needs:
      - release-please

    if: needs.release-please.outputs.releases_created == 'true'

    permissions:
      contents: write
      actions: write

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0


      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "go.sum"


      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # `latest` downloads whatever GoReleaser released most recently, with
          # no cooldown, so pin an exact version instead. Dependabot does not
          # bump this input — update it by hand, choosing a release that is at
          # least 7 days old to match the cooldown elsewhere in the repo.
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.OKCTL_FINE_GRAINED_TOKEN }}


      # NOTE: This has to be the last step that touches the release. Immutable
      # releases freeze the assets at publish time, so everything must already
      # be attached.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.OKCTL_FINE_GRAINED_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false


  ################################################################################
  # Test installation of OS packages
  ################################################################################
  test-installation:
    name: Test installation of OS packages
    needs: [goreleaser]
    uses: ./.github/workflows/test_os_packages.yml
