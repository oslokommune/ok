[settings]
# Ignore releases published within the last 7 days, matching the Dependabot
# cooldown and `min-release-age` in docs-optimizer/.npmrc. Requires mise
# 2026.6.2 or later; older mise silently ignores this setting.
#
# Bypass: add the tool to `minimum_release_age_excludes`, then remove it again
# once the update has landed. Pinning an exact version below installs that
# version regardless of the cooldown.
minimum_release_age = "7d"

# Install Python tools with uv instead of pipx.
pipx.uvx = true

# Record the exact versions and checksums of the installed tools in mise.lock.
lockfile = true

[tools]
# Keep in sync with the `go` directive in go.mod.
go = "1.25.3"
"aqua:magefile/mage" = "1.17.2"

# Runtime dependencies of the `ok` binary, also installed by the Homebrew formula.
"aqua:gruntwork-io/boilerplate" = "0.16.0"
"aqua:junegunn/fzf" = "0.74.2"
"aqua:mikefarah/yq" = "4.53.3"

# `mage docs` runs docs-optimizer/index.js and renders the README with cog.
node = "24.19.0"
"aqua:astral-sh/uv" = "0.12.0"
"pipx:cogapp" = "3.6.0"

[tasks.build]
description = "Build the project"
run = "mage build"

[tasks.test]
description = "Run the unit tests"
run = "mage test"

[tasks.docs]
description = "Generate and optimize the docs"
run = "mage docs"

[tasks.readme]
description = "Re-render the `ok --help` output in README.md"
run = "cog -r README.md"

[tasks.lock]
description = "Refresh mise.lock for every supported platform"
run = "mise lock --platform macos-arm64,macos-x64,linux-x64,linux-arm64"
